name = "voidmc"
main = "worker.ts"
compatibility_date = "2025-04-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "OTP_DO"
class_name = "OtpStore"

[[migrations]]
tag = "v1-otp-store"
new_sqlite_classes = ["OtpStore"]

[vars]
# Public values only. Anything secret belongs in Settings > Secrets, never here.
#
# STEP 0 BEFORE DEPLOY — this project needs its OWN Firebase project (free):
#   console.firebase.google.com > Add project > "voidmc-site"
#   > Build > Authentication > Sign-in method: enable Email/Password
#   > Authentication > Settings > Authorized domains: add the workers.dev host
#   > Project settings > Your apps > Web app: copy the config object
# Then replace the four values below AND firebase-applet-config.json with the real ones. They must
# match each other, and the Worker must be redeployed after any change here.
# FIRESTORE_DATABASE_ID is the literal database id shown in the Firestore picker — "(default)" for
# the built-in one, with the parentheses.
FIREBASE_API_KEY = "PASTE_REAL_WEB_API_KEY"
FIREBASE_PROJECT_ID = "voidmc-site"
FIRESTORE_DATABASE_ID = "(default)"

# EmailJS sends the 6-digit console login code. Create a free account, a service and a template with
# the parameters to_email / code / to_name, then paste the full "template_xxxxxxx" id here (not the
# short id from the editor URL).
EMAILJS_SERVICE_ID = "PASTE_SERVICE_ID"
EMAILJS_TEMPLATE_ID = "PASTE_TEMPLATE_ID"
EMAILJS_PUBLIC_KEY = "PASTE_PUBLIC_KEY"
# EMAILJS_PRIVATE_KEY is intentionally absent — set it as a Cloudflare Worker Secret.
